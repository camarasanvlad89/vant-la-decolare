<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paragliding Wind · Vânt la Decolare</title>
<link rel="canonical" href="https://paraglidingwind.com/">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d151b;color:#e4ebf0;font:16px/1.5 system-ui,sans-serif;padding:16px;text-align:center}
a{color:#ff8a3d;font-weight:600}
small{color:#93a3ae}
</style>
</head>
<body>
<p>Vânt la Decolare s-a mutat la <a id="go" href="https://paraglidingwind.com/">paraglidingwind.com</a><br><small>Paragliding Wind has moved to paraglidingwind.com</small></p>
<script>
/* Adresa veche: trimite datele salvate pe acest telefon (situri, praguri, jurnal) la adresa nouă, o singură dată, apoi redirecționează. */
(function(){
  var NEW = 'https://paraglidingwind.com/';
  var target = NEW + location.search;
  try {
    var get = function(k){ return JSON.parse(localStorage.getItem(k)); };
    var lang = get('vld.lang');
    if (lang && !/[?&]lang=/.test(location.search)) target = NEW + '?lang=' + lang;
    if (!get('vld.migrated') && navigator.onLine !== false){
      var data = {sites: get('vld.sites'), settings: get('vld.settings'), flights: get('vld.flights'), tomb: get('vld.tomb')};
      if ((data.sites && data.sites.length) || (data.flights && data.flights.length) || data.settings){
        var bytes = new TextEncoder().encode(JSON.stringify(data)), bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        target += '#migrate=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      localStorage.setItem('vld.migrated', 'true');
    }
  } catch (e) {}
  document.getElementById('go').href = target;
  location.replace(target);
})();
</script>
</body>
</html>
